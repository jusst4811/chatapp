<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatApp - Hệ thống quản lý lớp học</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; }
  .login-page { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(135deg, #667eea, #764ba2); }
  .login-box { background: white; padding: 40px; border-radius: 16px; width: 380px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
  .login-box h2 { text-align: center; color: #333; margin-bottom: 8px; font-size: 24px; }
  .login-box p { text-align: center; color: #888; margin-bottom: 28px; font-size: 14px; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; font-weight: 500; }
  .form-group input { width: 100%; padding: 12px 16px; border: 1.5px solid #e0e0e0; border-radius: 8px; font-size: 14px; outline: none; }
  .form-group input:focus { border-color: #667eea; }
  .btn { width: 100%; padding: 13px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px; }
  .btn:hover { opacity: 0.9; }
  .error-msg { color: #e74c3c; font-size: 13px; text-align: center; margin-top: 12px; display: none; }
  .dashboard { display: none; }
  .navbar { background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; }
  .navbar h1 { font-size: 20px; }
  .navbar-right { display: flex; align-items: center; gap: 16px; }
  .navbar-right span { font-size: 14px; opacity: 0.9; }
  .logout-btn { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4); color: white; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  .container { max-width: 1100px; margin: 32px auto; padding: 0 24px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .card { background: white; border-radius: 16px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
  .card h3 { font-size: 16px; color: #333; margin-bottom: 16px; }
  .class-list { list-style: none; }
  .class-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-radius: 8px; margin-bottom: 8px; background: #f8f9ff; border: 1px solid #e8eaff; cursor: pointer; transition: all 0.2s; }
  .class-item:hover { background: #eef0ff; border-color: #667eea; }
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
  .stat-box { background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 16px; border-radius: 12px; text-align: center; }
  .stat-box .num { font-size: 28px; font-weight: 700; }
  .stat-box .label { font-size: 12px; opacity: 0.85; margin-top: 4px; }
  .attendance-list { list-style: none; max-height: 280px; overflow-y: auto; }
  .attendance-item { display: flex; justify-content: space-between; padding: 10px 12px; border-radius: 8px; margin-bottom: 6px; background: #f8f9fa; }
  .badge { padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
  .badge-present { background: #d4edda; color: #155724; }
  .badge-absent { background: #f8d7da; color: #721c24; }
  .empty-state { text-align: center; color: #aaa; padding: 40px 0; font-size: 14px; }
  .loading { text-align: center; color: #667eea; padding: 20px; font-size: 14px; }
  .members-card { margin-top: 24px; }
  .member-list { list-style: none; }
  .member-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; margin-bottom: 6px; background: #f8f9fa; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #667eea, #764ba2); color: white; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; flex-shrink: 0; }
  .member-info { flex: 1; }
  .member-name { font-size: 14px; color: #333; font-weight: 500; }
  .member-username { font-size: 12px; color: #888; }
  select { width: 100%; padding: 10px 14px; border: 1.5px solid #e0e0e0; border-radius: 8px; font-size: 14px; outline: none; margin-bottom: 16px; }
  select:focus { border-color: #667eea; }
</style>
</head>
<body>

<!-- LOGIN PAGE -->
<div class="login-page" id="loginPage">
  <div class="login-box">
    <h2>🎓 ChatApp</h2>
    <p>Hệ thống quản lý lớp học</p>
    <div class="form-group">
      <label>Tên đăng nhập</label>
      <input type="text" id="username" placeholder="Nhập username...">
    </div>
    <div class="form-group">
      <label>Mật khẩu</label>
      <input type="password" id="password" placeholder="Nhập mật khẩu...">
    </div>
    <button class="btn" id="loginBtn">Đăng nhập</button>
    <div class="error-msg" id="errorMsg">Sai username hoặc mật khẩu!</div>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">
  <div class="navbar">
    <h1>🎓 ChatApp Dashboard</h1>
    <div class="navbar-right">
      <span>Xin chào, <strong id="usernameDisplay"></strong></span>
      <button class="logout-btn" id="logoutBtn">Đăng xuất</button>
    </div>
  </div>

  <div class="container">
    <div class="grid">
      <div class="card">
        <h3>📚 Danh sách lớp học</h3>
        <div id="classList"><div class="loading">Đang tải...</div></div>
      </div>
      <div class="card">
        <h3>📋 Điểm danh của tôi</h3>
        <div class="stats-grid">
          <div class="stat-box">
            <div class="num" id="presentCount">0</div>
            <div class="label">Có mặt</div>
          </div>
          <div class="stat-box">
            <div class="num" id="absentCount">0</div>
            <div class="label">Vắng mặt</div>
          </div>
        </div>
        <ul class="attendance-list" id="attendanceList">
          <li class="empty-state">Chưa có dữ liệu điểm danh</li>
        </ul>
      </div>
    </div>

    <div class="card members-card">
      <h3>👥 Thành viên lớp</h3>
      <select id="classSelect">
        <option value="">-- Chọn lớp --</option>
      </select>
      <ul class="member-list" id="memberList">
        <li class="empty-state">Chọn lớp để xem thành viên</li>
      </ul>
    </div>
  </div>
</div>

<script>
  var API = 'http://localhost:8080';
  var token = localStorage.getItem('token');
  var currentUser = localStorage.getItem('username');

  // Gắn sự kiện
  document.getElementById('loginBtn').addEventListener('click', doLogin);
  document.getElementById('logoutBtn').addEventListener('click', doLogout);
  document.getElementById('classSelect').addEventListener('change', loadMembers);
  document.getElementById('password').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') doLogin();
  });
  document.getElementById('username').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') doLogin();
  });

  if (token && currentUser) {
    showDashboard();
  }

  function doLogin() {
    var username = document.getElementById('username').value.trim();
    var password = document.getElementById('password').value.trim();
    if (!username || !password) return;

    fetch(API + '/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: username, password: password })
    })
    .then(function(res) { return res.json(); })
    .then(function(data) {
      if (data.success) {
        token = data.token;
        currentUser = data.username;
        localStorage.setItem('token', token);
        localStorage.setItem('username', currentUser);
        showDashboard();
      } else {
        document.getElementById('errorMsg').style.display = 'block';
        document.getElementById('errorMsg').textContent = data.message || 'Sai username hoặc mật khẩu!';
      }
    })
    .catch(function(e) {
      document.getElementById('errorMsg').style.display = 'block';
      document.getElementById('errorMsg').textContent = 'Không thể kết nối server!';
    });
  }

  function doLogout() {
    localStorage.removeItem('token');
    localStorage.removeItem('username');
    token = null;
    currentUser = null;
    document.getElementById('loginPage').style.display = 'flex';
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('username').value = '';
    document.getElementById('password').value = '';
    document.getElementById('errorMsg').style.display = 'none';
  }

  function showDashboard() {
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    document.getElementById('usernameDisplay').textContent = currentUser;
    loadClasses();
    loadAttendance();
  }

  function loadClasses() {
    fetch(API + '/api/classes', {
      headers: { 'Authorization': 'Bearer ' + token }
    })
    .then(function(res) { return res.json(); })
    .then(function(data) {
      var select = document.getElementById('classSelect');
      select.innerHTML = '<option value="">-- Chọn lớp --</option>';

      if (data.classes && data.classes.length > 0) {
        var html = '';
        for (var i = 0; i < data.classes.length; i++) {
          var cls = data.classes[i];
          html += '<li class="class-item" data-class="' + cls + '">📖 ' + cls + ' <span>›</span></li>';
          select.innerHTML += '<option value="' + cls + '">' + cls + '</option>';
        }
        document.getElementById('classList').innerHTML = '<ul class="class-list">' + html + '</ul>';

        // Gắn sự kiện click cho từng lớp
        var items = document.querySelectorAll('.class-item');
        for (var j = 0; j < items.length; j++) {
          items[j].addEventListener('click', function() {
            var cls = this.getAttribute('data-class');
            document.getElementById('classSelect').value = cls;
            loadMembers();
          });
        }
      } else {
        document.getElementById('classList').innerHTML = '<div class="empty-state">Không có lớp nào</div>';
      }
    })
    .catch(function(e) {
      document.getElementById('classList').innerHTML = '<div class="empty-state">Lỗi tải dữ liệu</div>';
    });
  }

  function loadAttendance() {
    fetch(API + '/api/attendance/' + currentUser, {
      headers: { 'Authorization': 'Bearer ' + token }
    })
    .then(function(res) { return res.json(); })
    .then(function(data) {
      var list = data.attendance || [];
      var present = 0, absent = 0;
      for (var i = 0; i < list.length; i++) {
        if (list[i].status === 'Present') present++;
        else absent++;
      }
      document.getElementById('presentCount').textContent = present;
      document.getElementById('absentCount').textContent = absent;

      if (list.length > 0) {
        var html = '';
        for (var j = 0; j < list.length; j++) {
          var a = list[j];
          var badge = a.status === 'Present' ? 'badge-present' : 'badge-absent';
          var label = a.status === 'Present' ? 'Có mặt' : 'Vắng';
          html += '<li class="attendance-item"><span>📅 ' + a.date + '</span><span class="badge ' + badge + '">' + label + '</span></li>';
        }
        document.getElementById('attendanceList').innerHTML = html;
      }
    })
    .catch(function(e) {});
  }

  function loadMembers() {
    var className = document.getElementById('classSelect').value;
    if (!className) return;
    document.getElementById('memberList').innerHTML = '<li class="loading">Đang tải...</li>';

    fetch(API + '/api/classes/' + className + '/members', {
      headers: { 'Authorization': 'Bearer ' + token }
    })
    .then(function(res) { return res.json(); })
    .then(function(data) {
      var members = data.members || [];
      if (members.length > 0) {
        var html = '';
        for (var i = 0; i < members.length; i++) {
          var m = members[i];
          var fullName = m.fullName || m.username || '?';
          var username = m.username || '';
          var initial = fullName.charAt(0).toUpperCase();
          html += '<li class="member-item">';
          html += '<div class="avatar">' + initial + '</div>';
          html += '<div class="member-info">';
          html += '<div class="member-name">' + fullName + '</div>';
          html += '<div class="member-username">' + username + '</div>';
          html += '</div></li>';
        }
        document.getElementById('memberList').innerHTML = html;
      } else {
        document.getElementById('memberList').innerHTML = '<li class="empty-state">Không có thành viên</li>';
      }
    })
    .catch(function(e) {
      document.getElementById('memberList').innerHTML = '<li class="empty-state">Lỗi tải dữ liệu</li>';
    });
  }
</script>
</body>
</html>
